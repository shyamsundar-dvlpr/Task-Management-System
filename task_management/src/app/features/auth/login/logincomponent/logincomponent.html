<div class="login-page">
  <div class="login-card">
    <h2 class="login-card__title">Login</h2>

    <form class="login-form" [formGroup]="form" (ngSubmit)="login()">
      <div class="form-group">
        <input class="form-input" type="text" placeholder="Username" formControlName="username" />
      </div>
      <div class="form-group">
        <input class="form-input" type="password" placeholder="Password" formControlName="password" />
      </div>
      <button class="btn btn--primary" type="submit">Login</button>
    </form>

    @if (error) {
      <p class="error-message">{{ error }}</p>
    }
  </div>
</div>
